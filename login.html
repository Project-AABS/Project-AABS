<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABBS Cinema | Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body id="main-body">
    <div class="container" id="container">
        
        <div class="form-container sign-up-container">
    <form action="register.php" method="POST">
        <h1>Create Account</h1>
        <input type="text" name="fullname" placeholder="Full Name" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit" name="signup">Sign Up</button> 
    </form>
</div>

<div class="form-container sign-in-container">
    <form action="login_process.php" method="POST">
        <h1>Login</h1>
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <a href="#" style="margin-bottom: 15px; color: #333; text-decoration: none; font-size: 14px;">Forgot password?</a>
        <button type="submit" name="login">Login</button>
    </form>
</div>

        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <p>Login to book your favorite seats</p>
                    <button class="ghost" id="signIn">Login</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>WELCOME TO ABBS CINEMA</h1>
                    <p>Don't have an account? Join us now!</p>
                    <button class="ghost" id="signUp">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
